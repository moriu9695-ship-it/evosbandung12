<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVOS Bandung | Mobile Legends Division</title>
<meta name="description" content="EVOS Bandung, divisi Mobile Legends dari West Java. Kenali roster dan tim di baliknya.">
<meta property="og:title" content="EVOS Bandung">
<meta property="og:description" content="Divisi Mobile Legends EVOS Bandung, West Java.">
<meta property="og:image" content="assets/images/logo.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070d1f">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d1f; --panel:#0e1730; --panel2:#142043; --line:#22305c;
  --text:#f4f7ff; --muted:#a3b1d6; --blue:#4f8cff; --blue-d:#2f6bf0;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Orbitron","Inter",system-ui,sans-serif;
  --pad:clamp(16px,4vw,40px);
}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--pad)}

/* header */
.topbar{position:sticky;top:0;z-index:50;background:rgba(7,13,31,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand img{height:44px;display:block}
nav{display:flex;align-items:center;gap:4px}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;padding:10px 14px;border-radius:8px}
nav a:hover{color:var(--text);background:var(--panel)}
.ig{display:inline-flex;align-items:center;gap:8px}
.ig svg{width:18px;height:18px;flex:none}

/* hero */
.hero{padding:clamp(56px,10vw,104px) 0 clamp(48px,8vw,80px);text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0b1635 0%,var(--bg) 100%)}
.hero .kicker{color:var(--blue);font-weight:600;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,8vw,4.6rem);letter-spacing:.04em;line-height:1.05;margin-bottom:16px}
.hero .meta{color:var(--muted);margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#06112b;font-weight:600;
  padding:12px 22px;border-radius:999px;text-decoration:none;border:0}
.btn:hover{background:#7aa6ff}

/* music */
.music{margin:28px auto 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:12px 16px;position:relative}
.track{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 200px}
.disc{width:40px;height:40px;border-radius:50%;flex:none;background:conic-gradient(var(--blue-d),var(--panel2),var(--blue-d));display:grid;place-items:center}
.disc::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--bg)}
.disc.playing{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tartist{color:var(--muted);font-size:.85rem}
.ctrl{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:.8rem}
.ib:hover{border-color:var(--blue)}
.ib.main{width:46px;height:46px;background:var(--blue);color:#06112b;border-color:var(--blue)}
.prog{display:flex;align-items:center;gap:10px;flex:2 1 240px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--panel2);cursor:pointer;position:relative;overflow:hidden}
.fill{height:100%;width:0;background:var(--blue)}
.vol{width:90px;accent-color:var(--blue)}
.pl{position:relative}
.panel{display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:10}
.panel.open{display:block}
.pli{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;display:block}
.pli:hover,.pli.active{background:var(--panel2)}
.pli.active .pn{color:var(--blue)}
.pn{font-weight:600;font-size:.92rem}.pa{color:var(--muted);font-size:.8rem}

/* roster */
.roster{padding:clamp(48px,8vw,80px) 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sh .label{color:var(--blue);font-weight:600;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:.04em}
.count{color:var(--muted);font-size:.9rem}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:500}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#06112b;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s}
.player:hover{transform:translateY(-4px);border-color:var(--blue)}
.pimg{aspect-ratio:3/4;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.ini{font-family:var(--display);font-size:2.4rem;color:var(--blue)}
.pinfo{padding:12px 14px 14px}
.pinfo h3{font-size:1.02rem;font-weight:600}
.pinfo p{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:24px 0}

footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;color:var(--muted);font-size:.9rem}
footer .ig{color:var(--text);text-decoration:none;font-weight:600;margin-bottom:10px}
.top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel2);display:none;place-items:center;font-size:1.1rem}
.top.show{display:grid}
@media (max-width:560px){nav a:not(.ig){padding:10px}.vol{display:none}.panel{right:auto;left:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.disc.playing{animation:none}.player{transition:none}.player:hover{transform:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="EVOS Bandung, ke atas"><img src="assets/images/logo.png" alt="EVOS Bandung"></a>
    <nav aria-label="Navigasi utama">
      <a href="#home">Home</a>
      <a href="#roster">Roster</a>
      <a class="ig" href="https://instagram.com/evosbandungalamin" target="_blank" rel="noopener" aria-label="Instagram @evosbandungalamin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="wrap">
      <p class="kicker">Mobile Legends Division</p>
      <h1>EVOS BANDUNG</h1>
      <p class="meta">Est. 2024 &middot; West Java</p>
      <a class="btn ig" href="https://instagram.com/evosbandungalamin" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        @evosbandungalamin
      </a>

      <div class="music" role="group" aria-label="Pemutar musik">
        <div class="track">
          <div class="disc" id="disc" aria-hidden="true"></div>
          <div style="min-width:0;text-align:left">
            <div class="tname" id="tname"></div>
            <div class="tartist" id="tartist"></div>
          </div>
        </div>
        <div class="ctrl">
          <button class="ib" id="prev" aria-label="Lagu sebelumnya">&#9664;&#9664;</button>
          <button class="ib main" id="play" aria-label="Putar">&#9654;</button>
          <button class="ib" id="next" aria-label="Lagu berikutnya">&#9654;&#9654;</button>
        </div>
        <div class="prog">
          <span id="cur">0:00</span>
          <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Posisi lagu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
          <span id="dur">0:00</span>
        </div>
        <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
        <div class="pl">
          <button class="ib" id="plbtn" aria-label="Daftar lagu" aria-expanded="false">&#9776;</button>
          <div class="panel" id="panel"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="roster" id="roster">
    <div class="wrap">
      <div class="sh">
        <div><span class="label">Meet the team</span><h2>MAIN ROSTER</h2></div>
        <span class="count" id="count"></span>
      </div>
      <div class="filter" id="filter" role="group" aria-label="Filter role"></div>
      <div class="players" id="players"></div>
    </div>
  </section>
</main>

<button class="top" id="top" aria-label="Kembali ke atas">&#8593;</button>

<footer>
  <div class="wrap">
    <a class="ig" href="https://instagram.com/evosbandungalamin" target="_blank" rel="noopener">@evosbandungalamin</a>
    <p>&copy; 2024 EVOS BANDUNG &middot; Mobile Legends Division</p>
  </div>
</footer>

<script>
/* Roster: ubah di sini. Tanpa "img" = tampil inisial. */
const ROLES = {gold:"Gold Laner", jungle:"Jungler", roam:"Roamer", exp:"EXP Laner", mid:"Mid Laner", flex:"Flex Player"};
const PLAYERS = [
  {name:"Yusuf",  role:"gold",   img:"yusuf"},
  {name:"Haidar", role:"jungle", img:"haidar"},
  {name:"Faris",  role:"roam",   img:"faris"},
  {name:"Mikail", role:"exp",    img:"mikail"},
  {name:"Ridwan", role:"exp",    img:"ridwan"},
  {name:"Fairus", role:"mid",    img:"fairus"},
  {name:"Affaw",  role:"mid",    img:"affaw"},
  {name:"Alif",   role:"jungle", img:"alif", label:"Jungler (Poke)"},
  {name:"Robin",  role:"flex",   img:"robin"},
  {name:"Emil",   role:"flex"}, {name:"Fatir", role:"flex"}, {name:"Kenzi", role:"flex"},
  {name:"Dzaky",  role:"flex"}, {name:"Geo",   role:"flex"}, {name:"Fahrain", role:"flex"}
];
const $ = id => document.getElementById(id);
const grid = $("players"), filterEl = $("filter");
let activeRole = "all";

function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e}

function renderRoster(){
  grid.replaceChildren();
  const list = PLAYERS.filter(p => activeRole==="all" || p.role===activeRole);
  list.forEach(p=>{
    const card = el("article","player"), wrap = el("div","pimg");
    if(p.img){const i=new Image(); i.src="assets/images/"+p.img+".jpg"; i.alt=p.name; i.loading="lazy"; wrap.appendChild(i)}
    else {wrap.appendChild(el("span","ini",p.name[0]))}
    const info = el("div","pinfo"); info.append(el("h3",null,p.name), el("p",null,p.label||ROLES[p.role]));
    card.append(wrap,info); grid.appendChild(card);
  });
  if(!list.length) grid.appendChild(el("p","empty","Belum ada pemain di role ini."));
  $("count").textContent = list.length + (activeRole==="all" ? " pemain aktif" : " pemain");
}
function renderFilter(){
  filterEl.replaceChildren();
  [["all","Semua"],...Object.entries(ROLES).map(([k,v])=>[k,v.replace(" Laner","").replace("Flex Player","Flex")])].forEach(([k,label])=>{
    const n = k==="all" ? PLAYERS.length : PLAYERS.filter(p=>p.role===k).length;
    if(!n) return;
    const b = el("button","chip",label+" "+n); b.type="button"; b.setAttribute("aria-pressed", String(k===activeRole));
    b.onclick = ()=>{activeRole=k; renderFilter(); renderRoster()};
    filterEl.appendChild(b);
  });
}
renderFilter(); renderRoster();

/* Musik */
const TRACKS = [
  {name:"Married With Children", artist:"Oasis",       src:"assets/audio/track.mp3"},
  {name:"Roar Anthem",           artist:"Lucky Adnan", src:"assets/audio/roar-anthem.mp3"},
  {name:"Basket Case",           artist:"Green Day",   src:"assets/audio/basket-case.mp3"},
  {name:"Stand By Me",           artist:"Oasis",       src:"assets/audio/stand-by-me.mp3"}
];
let cur = 0;
const audio = new Audio(); audio.preload="metadata"; audio.volume=.7;
const playBtn=$("play"), disc=$("disc"), panel=$("panel");
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";

function setPlaying(on){playBtn.innerHTML = on ? "&#9646;&#9646;" : "&#9654;"; playBtn.setAttribute("aria-label", on?"Jeda":"Putar"); disc.classList.toggle("playing", on)}
function renderList(){
  panel.replaceChildren();
  TRACKS.forEach((t,i)=>{
    const b = el("button","pli"+(i===cur?" active":"")); b.type="button";
    b.append(el("div","pn",t.name), el("div","pa",t.artist));
    b.onclick = ()=>{load(i,true); closePanel()}; panel.appendChild(b);
  });
}
function load(i, autoplay){
  cur = (i+TRACKS.length)%TRACKS.length;
  const t = TRACKS[cur]; audio.src = t.src;
  $("tname").textContent=t.name; $("tartist").textContent=t.artist;
  $("fill").style.width="0%"; $("cur").textContent="0:00"; $("dur").textContent="0:00";
  renderList();
  if(autoplay) audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false)); else setPlaying(false);
}
playBtn.onclick = ()=>{ if(audio.paused) audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false)); else {audio.pause(); setPlaying(false)} };
$("next").onclick = ()=>load(cur+1,true); $("prev").onclick = ()=>load(cur-1,true);
$("vol").oninput = e=>{audio.volume=e.target.value};
audio.addEventListener("timeupdate",()=>{ if(!audio.duration) return; const p=audio.currentTime/audio.duration*100;
  $("fill").style.width=p+"%"; $("cur").textContent=fmt(audio.currentTime); $("bar").setAttribute("aria-valuenow",Math.round(p))});
audio.addEventListener("loadedmetadata",()=>{$("dur").textContent=fmt(audio.duration)});
audio.addEventListener("ended",()=>load(cur+1,true));
audio.addEventListener("error",()=>{$("tartist").textContent="Lagu tidak bisa dimuat"; setPlaying(false)});
$("bar").addEventListener("click",e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration});
$("bar").addEventListener("keydown",e=>{ if(e.key==="ArrowRight") audio.currentTime+=5; if(e.key==="ArrowLeft") audio.currentTime-=5});
function closePanel(){panel.classList.remove("open"); $("plbtn").setAttribute("aria-expanded","false")}
$("plbtn").onclick = e=>{e.stopPropagation(); const o=panel.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",String(o))};
document.addEventListener("click",e=>{ if(!e.target.closest(".pl")) closePanel()});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePanel()});
load(0,false);

/* Tombol ke atas */
const top_=$("top");
addEventListener("scroll",()=>top_.classList.toggle("show", scrollY>500),{passive:true});
top_.onclick = ()=>scrollTo({top:0,behavior:"smooth"});
</script>
</body>
</html>
